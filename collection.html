<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:wght@400;600;700;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine/deck.css">
<link rel="stylesheet" href="engine/pages.css">
<script src="engine/theme.js?v=7"></script>
</head>
<body>
<div class="shapes" style="position:fixed">
  <div class="sh blob" style="width:480px;height:480px;background:var(--a2);left:-120px;top:-120px"></div>
  <div class="sh blob" style="width:400px;height:400px;background:var(--a1);right:-100px;bottom:-100px"></div>
  <div class="sh sq float2" style="width:150px;height:150px;left:7%;bottom:18%;color:var(--a3);transform:rotate(16deg)"></div>
</div>
<div class="wrap" id="wrap"></div>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('collection');
  const token = params.get('token');
  const tokenQS = token ? '&token=' + encodeURIComponent(token) : '';
  const wrap = document.getElementById('wrap');
  const BACKEND = 'https://generic-crud.agreeabledesert-b2caaf68.norwayeast.azurecontainerapps.io/generic-crud';
  const APP_ID = '7d125c22-d3bf-480f-bc09-af3c16aff513';

  const render = C => {
    document.title = C.name;
    wrap.innerHTML =
      '<a class="backlink" href="index.html">← All collections</a>' +
      '<p class="kicker">'+(C.year||'')+(C.instructor?' · '+C.instructor:'')+'</p>' +
      '<h1>'+C.name.replace(/^(\S+)/,'$1<br>')+'</h1><div class="rule"></div>' +
      (C.subtitle?'<p class="lead">'+C.subtitle+'</p>':'') +
      '<div class="tiles">' + C.decks.map((c,n) =>
        '<a class="tile a'+((n%3)+1)+'" href="deck.html?collection='+encodeURIComponent(C.id)+'&deck='+(n+1)+tokenQS+'">' +
          '<div class="n">'+c.label.toUpperCase()+'</div>' +
          '<h3>'+c.title+'</h3>' +
          '<p>'+(c.blurb||'')+'</p>' +
        '</a>').join('') + '</div>';
  };

  const notFound = () => wrap.innerHTML = '<h2>No collection called "'+id+'".</h2><p><a class="backlink" href="index.html">All collections</a></p>';

  const fromBackend = () => fetch(BACKEND + '/api/store/' + APP_ID + '/' + id + '.collection', {
      headers: token ? { 'x-app-token': token } : {}
    })
    .then(r => { if(!r.ok) throw 0; return r.json(); })
    .then(r => render(r.doc))
    .catch(notFound);

  if(!id){
    wrap.innerHTML = '<h2>No collection was given.</h2><p><a class="backlink" href="index.html">All collections</a></p>';
  } else {
    const el = document.createElement('script');
    el.src = 'collections/'+id+'/collection.js?v=8';
    el.onerror = fromBackend;
    el.onload = () => render(window.COLLECTION);
    document.head.appendChild(el);
  }
</script>
</body>
</html>
