<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:wght@400;600;700;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine/deck.css">
<link rel="stylesheet" href="engine/pages.css">
<script src="engine/theme.js?v=7"></script>
</head>
<body>
<div class="shapes" style="position:fixed">
  <div class="sh blob" style="width:480px;height:480px;background:var(--a2);left:-120px;top:-120px"></div>
  <div class="sh blob" style="width:400px;height:400px;background:var(--a1);right:-100px;bottom:-100px"></div>
  <div class="sh ring float" style="width:300px;height:300px;right:12%;top:18%;color:var(--a1)"></div>
</div>
<div class="wrap">
  <p class="kicker">Decks</p>
  <h1>Collections</h1>
  <div class="rule"></div>
  <form id="open-form" style="display:flex;gap:10px;align-items:center;margin:0 0 28px">
    <input id="open-id" type="text" placeholder="Collection id, e.g. demo101"
      style="flex:0 1 320px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit">
    <button type="submit" style="padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;cursor:pointer">Open</button>
  </form>
  <div class="tiles" id="tiles"></div>
</div>
<script src="collections.js?v=7"></script>
<script>
  document.getElementById('tiles').innerHTML = (window.COLLECTIONS||[]).map(c =>
    '<a class="tile a'+(c.accent||1)+'" href="collection.html?collection='+encodeURIComponent(c.id)+'">' +
      '<div class="n">'+(c.year||'')+'</div>' +
      '<h3>'+c.name+'</h3>' +
      '<p>'+(c.subtitle||'')+'</p>' +
      '<div class="st">'+c.decks+' '+(c.decks===1?'deck':'decks')+'</div>' +
    '</a>').join('') || '<p>No collections listed in collections.js yet.</p>';

  document.getElementById('open-form').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('open-id').value.trim();
    if(id) location.href = 'collection.html?collection=' + encodeURIComponent(id);
  });
</script>
</body>
</html>
